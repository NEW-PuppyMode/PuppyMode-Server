name: Java CI/CD Pipeline with Gradle

on:
  push:
    branches: [ "dev" ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:

      #------------------- CI --------------------

      - name: Checkout
        uses: actions/checkout@v4

      # JDK 세팅
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # gradlew 실행 권한 부여
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # 빌드 시간 단축을 위한 Gradle 캐싱
      - name: Gradle Caching
        uses: actions/cache@v3
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      # Spring Boot 어플리케이션 빌드
      - name: Spring Boot Build
        run: ./gradlew clean build -x test

      # IAM 역할을 통한 인증 구성 (OIDC 기반)
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          role-session-name: ${{ github.repository }}-${{ github.run_id }}
          aws-region: ap-northeast-2

      # ECR 로그인
      - name: Login to ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # Docker 이미지 빌드 후 ECR에 푸시
      - name: Build and Push Docker image to ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: puppy-mode
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build --build-arg JAR_FILE=build/libs/puppymode2-0.0.1-SNAPSHOT.jar -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG

      #------------------- CD --------------------

      #  ECS Task Definition 다운로드 후 JSON 파일로 저장
      - name: Download ECS task definition
        run: |
          aws ecs describe-task-definition --task-definition ${{ secrets.ECS_TASK_DEFINITION }} --query taskDefinition > task-definition.json

      # 다운로드한 Task Definition에 새 이미지 태그 적용
      - name: Fill in the new image ID in the task definition
        id: update-task-def
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: task-definition.json
          container-name: puppy-mode-ecs-container
          image: ${{ secrets.ECR_URI }}:${{ github.sha }}

      # ECS에 새 Task Definition 배포 후 안정화까지 대기
      - name: Deploy to ECS
        uses: aws-actions/amazon-ecs-deploy-task-definition@v1
        with:
          service: puppy-mode-ecs-service
          cluster: puppy-mode-cluster
          task-definition: ${{ steps.update-task-def.outputs.task-definition }}
          wait-for-service-stability: true
